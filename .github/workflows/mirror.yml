name: Mirror canonical public site
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout this legacy repository
        uses: actions/checkout@v4
      - name: Test download recovery and artifact readiness
        run: |
          python3 tools/test_mirror_site.py
          node tools/test_pages_artifact.cjs
      - name: Download and validate one canonical snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/mirror_site.py --sync-root .
      - name: Retain public snapshot in this repository
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t public_files < _mirror_files.txt
          git add -- "${public_files[@]}"
          if ! git diff --cached --quiet -- "${public_files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            snapshot_sha="$(cat _mirror_sha.txt)"
            git commit -m "Mirror canonical public site at ${snapshot_sha}" -- "${public_files[@]}"
            git push origin HEAD:main
          fi
      - name: Upload only validated public files
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
  deploy:
    needs: mirror
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      artifact_id: ${{ needs.mirror.outputs.artifact_id }}
